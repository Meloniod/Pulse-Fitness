name: PULSE validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build

  tracker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/build_tracker.py
      - uses: actions/upload-artifact@v4
        with:
          name: PULSE-personal-trainer-tracker
          path: tracker/PULSE_Personal_Trainer_Tracker.xlsx
      - name: Commit generated workbook
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tracker/PULSE_Personal_Trainer_Tracker.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Build PULSE companion tracker"
            git push
          fi
